<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troco Verificado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Calculadora para calcular TROCOOOOOOO</h1>
  <p>Calcule seu troco aqui
            👇
  </p>

  <div>
    <label for="preco">Preço do produto:</label>
    <input type="number" id="preco" placeholder="Digite o preço unitário">

    <label for="quantidade">Quantidade comprada:</label>
    <input type="number" id="quantidade" placeholder="Digite a quantidade">

    <label for="dinheiro">Dinheiro recebido:</label>
    <input type="number" id="dinheiro" placeholder="Digite o dinheiro recebido">
  </div>

  <button>Calcular troco</button>

  <p id="resultado"></p>

  <script src="script.js"></script>
</body>
</html>
